name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect Changed Services ───────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      cards: ${{ steps.filter.outputs.cards }}
      automation: ${{ steps.filter.outputs.automation }}
      assessment: ${{ steps.filter.outputs.assessment }}
      frontend: ${{ steps.filter.outputs.frontend }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'authentication/**'
            cards:
              - 'cards/**'
            automation:
              - 'automation/**'
            assessment:
              - 'start/**'
            frontend:
              - 'frontend/**'
            packages:
              - 'packages/**'

  # ─── Auth Service ──────────────────────────────────────────────────────────
  auth-ci:
    name: Auth Service CI
    needs: changes
    if: ${{ needs.changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./authentication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: authentication/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Build Docker image
        run: docker build --target production -t plp-auth:${{ github.sha }} .

  # ─── Cards Service ─────────────────────────────────────────────────────────
  cards-ci:
    name: Cards Service CI
    needs: changes
    if: ${{ needs.changes.outputs.cards == 'true' || needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cards/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build Docker image
        run: docker build --target production -t plp-cards:${{ github.sha }} .

  # ─── Automation Service ────────────────────────────────────────────────────
  automation-ci:
    name: Automation Service CI
    needs: changes
    if: ${{ needs.changes.outputs.automation == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Lint
        run: |
          pip install flake8
          flake8 app/ --max-line-length=120 --ignore=E501,W503
      - name: Test
        run: pytest tests/ --if-present || echo "No tests yet"
      - name: Build Docker image
        run: docker build --target production -t plp-automation:${{ github.sha }} .

  # ─── Assessment Service ────────────────────────────────────────────────────
  assessment-ci:
    name: Assessment Service CI
    needs: changes
    if: ${{ needs.changes.outputs.assessment == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: start/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Build Docker image
        run: docker build --target production -t plp-assessment:${{ github.sha }} .

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_AUTH_URL: http://localhost:4000
          NEXT_PUBLIC_CARDS_URL: http://localhost:5000
          NEXT_PUBLIC_AUTOMATION_URL: http://localhost:7000
          NEXT_PUBLIC_ASSESSMENT_URL: http://localhost:6060

  # ─── All CI Passed Gate ────────────────────────────────────────────────────
  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [auth-ci, cards-ci, automation-ci, assessment-ci, frontend-ci]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
